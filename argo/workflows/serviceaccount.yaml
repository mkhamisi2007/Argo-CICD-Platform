# Service account used by both WorkflowTemplates (ci-pipeline, deploy-pipeline).
# The role-arn annotation must be the "argo-workflows-ecr" IRSA role created by
# terraform (output: terraform/modules/security -> argo_workflows_ecr_role_arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows
  namespace: argo
  annotations:
    eks.amazonaws.com/role-arn: "<ARGO_WORKFLOWS_ECR_ROLE_ARN>"
