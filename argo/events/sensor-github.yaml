# Subscribes to the GitHub EventSource. Only "push" events to refs/heads/main are
# accepted (filtered below); on match, creates a Workflow from ci-pipeline,
# passing the short commit SHA as image-tag.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: github
  namespace: argo-events
spec:
  template:
    serviceAccountName: argo-events-sa
  dependencies:
    - name: github-push
      eventSourceName: github
      eventName: push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - "refs/heads/main"
  triggers:
    - template:
        name: trigger-ci-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: ci-
                namespace: argo
              spec:
                serviceAccountName: argo-workflows
                workflowTemplateRef:
                  name: ci-pipeline
                arguments:
                  parameters:
                    - name: repo-url
                      value: ""
                    - name: image-tag
                      value: ""
                    - name: ecr-repo
                      value: "<ECR_REPO_URI>"
          parameters:
            - src:
                dependencyName: github-push
                dataKey: body.repository.clone_url
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: github-push
                dataTemplate: "{{ substr 0 7 .Input.body.after }}"
              dest: spec.arguments.parameters.1.value
