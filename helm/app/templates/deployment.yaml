{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "argo-cicd-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argo-cicd-app.labels" . | nindent 4 }}
  annotations:
    # Argo Rollouts notifications (configured in argo/rollouts/analysis-template.yaml):
    # posts to Slack when the canary is aborted/rolled back, and again when it
    # finishes promoting to 100% (stable).
    notifications.argoproj.io/subscribe.on-rollout-aborted.slack: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.slack: ""
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "argo-cicd-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argo-cicd-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "argo-cicd-app.serviceAccountName" . }}
      containers:
        - name: {{ include "argo-cicd-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  strategy:
    canary:
      canaryService: app-canary-svc
      stableService: app-stable-svc
      trafficRouting:
        alb:
          ingress: app-ingress
          servicePort: {{ .Values.service.port }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argo-cicd-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argo-cicd-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "argo-cicd-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argo-cicd-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "argo-cicd-app.serviceAccountName" . }}
      containers:
        - name: {{ include "argo-cicd-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
