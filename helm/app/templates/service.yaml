apiVersion: v1
kind: Service
metadata:
  name: app-stable-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argo-cicd-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "argo-cicd-app.selectorLabels" . | nindent 4 }}
{{- if .Values.rollout.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: app-canary-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argo-cicd-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "argo-cicd-app.selectorLabels" . | nindent 4 }}
{{- end }}
