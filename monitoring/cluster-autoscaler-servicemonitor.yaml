# Scrapes the Cluster Autoscaler's existing metrics Service (port 8085), providing
# cluster_autoscaler_nodes_count - used by the "Node Count" panel in
# grafana-dashboard.json. terraform/autoscaler.tf's helm_release for
# cluster-autoscaler already creates the Service; only the ServiceMonitor is added
# here (see argo-rollouts-metrics.yaml for why this lives in "monitoring").
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cluster-autoscaler
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-cluster-autoscaler
      app.kubernetes.io/instance: cluster-autoscaler
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
